
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>LET'S IMPROVE ENGLISH</title>

    <link rel="stylesheet" href="style.css">

    <!-- OFFLINE APP MANIFEST -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#173F35">

</head>


<body>

    <!-- =========================================
         APP HEADER
    ========================================== -->

    <header class="app-header">

        <h1>📚 LET'S IMPROVE ENGLISH</h1>

        <p>
            Learn • Understand • Speak • Improve
        </p>

    </header>


    <!-- =========================================
         MAIN MENU
    ========================================== -->

    <main id="menu-screen" class="main-menu">

        <h2>Choose a Category</h2>


        <!-- CATEGORY 1 -->

        <button class="category-btn"
                onclick="openCategory(1)">

            <span class="number">1</span>

            <span class="category-text">
                <strong>Simple Sentences</strong>
                <small>No Action — Present • Past • Future</small>
            </span>

        </button>


        <!-- CATEGORY 2 -->

        <button class="category-btn"
                onclick="openCategory(2)">

            <span class="number">2</span>

            <span class="category-text">
                <strong>Tenses</strong>
                <small>Present • Past • Future</small>
            </span>

        </button>


        <!-- CATEGORY 3 -->

        <button class="category-btn"
                onclick="openCategory(3)">

            <span class="number">3</span>

            <span class="category-text">
                <strong>Synonyms & Antonyms</strong>
                <small>Improve your vocabulary</small>
            </span>

        </button>


        <!-- CATEGORY 4 -->

        <button class="category-btn"
                onclick="openCategory(4)">

            <span class="number">4</span>

            <span class="category-text">
                <strong>Sentence Patterns</strong>
                <small>Learn how sentences are built</small>
            </span>

        </button>


        <!-- CATEGORY 5 -->

        <button class="category-btn"
                onclick="openCategory(5)">

            <span class="number">5</span>

            <span class="category-text">
                <strong>Daily-Use Sentences</strong>
                <small>English for everyday life</small>
            </span>

        </button>


        <!-- CATEGORY 6 -->

        <button class="category-btn"
                onclick="openCategory(6)">

            <span class="number">6</span>

            <span class="category-text">
                <strong>Simple Modals</strong>
                <small>Can • Could • May • Must • Should</small>
            </span>

        </button>


        <!-- CATEGORY 7 -->

        <button class="category-btn"
                onclick="openCategory(7)">

            <span class="number">7</span>

            <span class="category-text">
                <strong>Pronunciation Practice</strong>
                <small>Listen • Speak • Improve</small>
            </span>

        </button>

    </main>


    <!-- =========================================
         CATEGORY SCREEN
    ========================================== -->

    <section id="category-screen"
             class="category-screen"
             style="display:none;">

        <button class="back-btn"
                onclick="backToCategories()">

            ← BACK

        </button>


        <h2 id="category-title"></h2>

        <p id="category-message"></p>


        <!-- =====================================
             PART 3 — SYNONYMS & ANTONYMS
        ====================================== -->

        <div id="part3-content"
             class="part3-content"
             style="display:none;">

            <h3 class="part3-heading">
                SYNONYMS & ANTONYMS
            </h3>

            <p class="part3-intro">
                Improve your vocabulary
            </p>


            <!-- WORD CONTENT WILL BE ADDED NEXT -->

        </div>

    </section>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>
            Learn English • Speak English • Improve English
        </p>

        <p>
            © LET'S IMPROVE ENGLISH
        </p>

    </footer>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>


    <!-- =========================================
         OFFLINE SERVICE WORKER
    ========================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker
                    .register("./service-worker.js")
                    .then(function (registration) {

                        console.log(
                            "Offline mode enabled:",
                            registration.scope
                        );

                    })
                    .catch(function (error) {

                        console.error(
                            "Offline mode failed:",
                            error
                        );

                    });

            });

        }

    </script>


</body>
</html>
